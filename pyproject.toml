[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-churn-prediction"
version = "0.1.0"
description = "Plataforma de predição de churn para Sky Brazil - Extrai dados NPAW, treina modelos ML (SageMaker), explica via SHAP e Bedrock"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sky Brazil Data Team" },
]

dependencies = [
    "boto3>=1.34.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "shap>=0.44.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "streamlit>=1.29.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.0",
    "sagemaker>=2.200.0",
    "aws-cdk-lib>=2.120.0",
    "constructs>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "moto[all]>=4.2.0",
    "hypothesis>=6.92.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
